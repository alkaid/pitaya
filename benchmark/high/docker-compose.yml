#    depends_on: ["nats"]
#    networks: ["high-testing"]
  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.14@sha256:a491baeaa0cb0c9cd89c0062ac44ece53886e3e5bddad18d2daf36678ce665b6
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/var/lib/etcd/default.etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
#    ports:
#      - "2379:2379"
  redis:
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports:
      - "6379:6379"
  netutils:
    image: nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
    command: ["tail", "-f", "/dev/null"]
  pitaya-bench-frontend:
    image: pitaya-dev:go1.26.5
    ports:
      - "32222:32222"
    depends_on:
      - nats
      - etcd
      - redis
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65515"
      net.ipv4.tcp_abort_on_overflow: 1
      net.ipv4.tcp_max_syn_backlog: 10000
      net.core.somaxconn: 10000
# 非安全选项,需要root权限,只能在宿主机上单独设置
#      net.netfilter.nf_conntrack_max: 1048576
    command: ./examples/testing/server -type connector -frontend=true -natsurl=nats://nats:4222 -etcdurl=etcd:2379 -redisurl=redis:6379 -debug=true
  pitaya-bench-backend:
    image: pitaya-dev:go1.26.5
    depends_on:
      - nats
      - etcd
      - redis
    command: ./examples/testing/server -type game -frontend=false -natsurl=nats://nats:4222 -etcdurl=etcd:2379 -redisurl=redis:6379
  pitaya-bench-client:
    image: pitaya-dev:go1.26.5
    scale: 3
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65515"
      net.ipv4.tcp_abort_on_overflow: 1
      net.ipv4.tcp_max_syn_backlog: 10000
      net.core.somaxconn: 10000
    depends_on:
      - pitaya-bench-frontend
      - pitaya-bench-backend
    command: go test -v benchmark/benchmark_test.go -bench=CreateManyClients -benchmem -host=pitaya-bench-frontend -port=32222 -benchtime=10000x
