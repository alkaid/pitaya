name: Tests

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      coverage_base_sha:
        description: Full 40-character commit SHA used as the coverage diff base
        required: true
        type: string

jobs:
  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Verify fork documentation policy
      run: make docs-lint

  tools-verify:
    name: Tools Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify root and tool modules
      run: |
        GOWORK=off go mod download
        GOWORK=off go mod verify
        GOWORK=off go mod download -modfile=tools/go.mod
        GOWORK=off go mod verify -modfile=tools/go.mod
    - name: Verify pinned tools, actions, and images
      run: make tools-verify

  module-verify:
    name: Module Verify
    needs: tools-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify source modules
      run: |
        for module in . pitaya-cli xk6-pitaya; do
          (
            cd "$module"
            GOWORK=off go mod download
            GOWORK=off go mod verify
          )
        done
    - name: Verify workspace and standalone modules
      run: make module-verify

  logrus-verify:
    name: Logrus Verify
    needs: module-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify source modules
      run: |
        for module in . pitaya-cli xk6-pitaya; do
          (
            cd "$module"
            GOWORK=off go mod download
            GOWORK=off go mod verify
          )
        done
    - name: Verify first-party Logrus removal
      run: make logrus-verify

  compile:
    name: Compile
    needs:
    - logrus-verify
    - docs-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify source modules
      run: |
        for module in . pitaya-cli xk6-pitaya; do
          (
            cd "$module"
            GOWORK=off go mod download
            GOWORK=off go mod verify
          )
        done
    - name: Compile root, CLI, and xk6 packages
      run: make compile

  compile-platforms:
    name: Compile-only (${{ matrix.goos }}/amd64)
    needs: module-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos:
        - darwin
        - windows
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify source modules
      run: |
        for module in . pitaya-cli xk6-pitaya; do
          (
            cd "$module"
            GOWORK=off go mod download
            GOWORK=off go mod verify
          )
        done
    - name: Cross-compile all modules
      run: make compile-platform TARGET_GOOS=${{ matrix.goos }} TARGET_GOARCH=amd64

  unit:
    name: Unit Test
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify root module
      run: |
        GOWORK=off go mod download
        GOWORK=off go mod verify
    - name: Run root unit tests
      run: make test-unit

  race:
    name: Targeted Race
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: compile
    runs-on: ubuntu-24.04
    # Leave setup and failure-diagnostic headroom beyond go test's 10m timeout.
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify root module
      run: |
        GOWORK=off go mod download
        GOWORK=off go mod verify
    - name: Run the full targeted race set
      run: make test-race

  integration:
    name: Redis Integration
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: compile
    runs-on: ubuntu-24.04
    # Leave setup, bounded diagnostics, and teardown headroom beyond the harness.
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify root module
      run: |
        GOWORK=off go mod download
        GOWORK=off go mod verify
    - name: Run the isolated Redis integration suites
      run: make test-integration

  vet:
    name: Vet
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify root module
      run: |
        GOWORK=off go mod download
        GOWORK=off go mod verify
    - name: Vet root packages
      run: make vet

  fuzz-seeds:
    name: Fuzz Seed Corpus
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
    - name: Download and verify root and tool modules
      run: |
        GOWORK=off go mod download
        GOWORK=off go mod verify
        GOWORK=off go mod download -modfile=tools/go.mod
        GOWORK=off go mod verify -modfile=tools/go.mod
    - name: Run registered fuzz seed corpus
      run: make test-fuzz-seeds

  consumer:
    name: Consumer
    needs:
    - unit
    - vet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify root module
      run: |
        GOWORK=off go mod download
        GOWORK=off go mod verify
    - name: Test an independent consumer
      run: make test-consumer

  verify-fast:
    name: Verify Fast
    if: ${{ always() }}
    needs:
    - consumer
    - fuzz-seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Aggregate fast-gate result
      env:
        CONSUMER_RESULT: ${{ needs.consumer.result }}
        FUZZ_SEEDS_RESULT: ${{ needs.fuzz-seeds.result }}
      run: |
        test "$CONSUMER_RESULT" = success
        test "$FUZZ_SEEDS_RESULT" = success

  distribution:
    name: Distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify source and tool modules
      run: |
        for module in . pitaya-cli xk6-pitaya; do
          (
            cd "$module"
            GOWORK=off go mod download
            GOWORK=off go mod verify
          )
        done
        GOWORK=off go mod download -modfile=tools/go.mod
        GOWORK=off go mod verify -modfile=tools/go.mod
    - name: Test versioned installed distributions
      run: make test-distribution

  coverage:
    name: Linux amd64 Full Package Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOARCH: amd64
      GOOS: linux
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify root and tool modules
      run: |
        GOWORK=off go mod download
        GOWORK=off go mod verify
        GOWORK=off go mod download -modfile=tools/go.mod
        GOWORK=off go mod verify -modfile=tools/go.mod
    - name: Run full-package coverage
      run: GOWORK=off make coverage-stamped
    - name: Resolve coverage diff base
      id: coverage-base
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_DELETED: ${{ github.event.deleted }}
        DISPATCH_BASE: ${{ inputs.coverage_base_sha }}
      run: |
        set -euo pipefail

        head="$(git rev-parse HEAD)"
        test "$head" = "$GITHUB_SHA"

        case "$EVENT_NAME" in
          pull_request)
            git rev-parse --verify "${head}^{commit}^2" >/dev/null
            base="$(git rev-parse "${head}^{commit}^1")"
            ;;
          push)
            test "$PUSH_DELETED" != "true"
            base="$PUSH_BEFORE"
            ;;
          workflow_dispatch)
            base="$DISPATCH_BASE"
            ;;
          *)
            echo "unsupported event: $EVENT_NAME" >&2
            exit 1
            ;;
        esac

        [[ "$base" =~ ^[0-9a-fA-F]{40}$ ]]
        test "$base" != 0000000000000000000000000000000000000000

        if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$base"
        fi
        base="$(git rev-parse "${base}^{commit}")"

        if test "$EVENT_NAME" = workflow_dispatch; then
          test "$base" != "$head"
          git merge-base --is-ancestor "$base" "$head"
        fi

        printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"
    - name: Enforce coverage policy
      env:
        COVERAGE_DIFF_BASE: ${{ steps.coverage-base.outputs.sha }}
        COVERAGE_DIFF_HEAD: ${{ github.sha }}
      run: GOWORK=off make coverage-gate
    - name: Send coverage
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: GOWORK=off go tool -modfile=tools/go.mod goveralls -coverprofile=coverprofile.out -service=github

  generated-docs:
    name: Generated Protobuf and Docs
    needs: docs-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify root and tool modules
      run: |
        GOWORK=off go mod download
        GOWORK=off go mod verify
        GOWORK=off go mod download -modfile=tools/go.mod
        GOWORK=off go mod verify -modfile=tools/go.mod
    - name: Install protoc 35.1
      env:
        PROTOC_SHA256: 6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7
        PROTOC_URL: https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
      run: |
        archive="$RUNNER_TEMP/protoc.zip"
        curl --fail --location --silent --show-error "$PROTOC_URL" --output "$archive"
        echo "$PROTOC_SHA256  $archive" | sha256sum --check --strict
        unzip -q "$archive" -d "$RUNNER_TEMP/protoc"
        echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
    - name: Verify generated protobuf
      run: |
        make protos-compile protos-compile-demo
        git diff --exit-code
        test -z "$(git status --short --untracked-files=all)"
    - name: Install documentation tools
      working-directory: docs
      run: |
        python3 -m venv "$RUNNER_TEMP/docs-venv"
        "$RUNNER_TEMP/docs-venv/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
    - name: Build documentation
      run: |
        make docs SPHINXBUILD="$RUNNER_TEMP/docs-venv/bin/sphinx-build" DOCS_BUILDDIR="$RUNNER_TEMP/docs-build"
        test -s "$RUNNER_TEMP/docs-build/html/index.html"

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify source and tool modules
      run: |
        for module in . pitaya-cli xk6-pitaya; do
          (
            cd "$module"
            GOWORK=off go mod download
            GOWORK=off go mod verify
          )
        done
        GOWORK=off go mod download -modfile=tools/go.mod
        GOWORK=off go mod verify -modfile=tools/go.mod
    # GO-2026-5932 remains reachable and is not fixed. The maintainer approved a
    # 360-day exception on 2026-08-10; scripts/vuln-exceptions.txt limits it to
    # ordinary etcd remote configuration through 2027-08-05 UTC. Revoke or
    # review the exception before enabling OpenPGP remote configuration.
    - name: Scan reachable dependencies
      run: make scan-deps
    - name: Upload dependency reports
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: govulncheck-${{ github.sha }}
        path: build/govulncheck/*.json
        if-no-files-found: error
        retention-days: 14

  e2e-nats:
    name: NATS End to End
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
          pitaya-cli/go.sum
          xk6-pitaya/go.sum
    - name: Download and verify root module
      run: |
        GOWORK=off go mod download
        GOWORK=off go mod verify
    - name: Run deterministic NATS end-to-end tests
      run: make test-e2e-nats
