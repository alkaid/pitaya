name: Tests

permissions:
  contents: read

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  toolchain-check:
    name: Toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
    - name: Install protoc 35.1
      env:
        PROTOC_SHA256: 6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7
        PROTOC_URL: https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
      run: |
        archive="$RUNNER_TEMP/protoc.zip"
        curl --fail --location --silent --show-error "$PROTOC_URL" --output "$archive"
        echo "$PROTOC_SHA256  $archive" | sha256sum --check --strict
        unzip -q "$archive" -d "$RUNNER_TEMP/protoc"
        echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
    - name: Verify generated protobuf
      run: |
        make protos-compile protos-compile-demo
        git diff --exit-code
        test -z "$(git status --short --untracked-files=all)"
    - name: Install documentation tools
      working-directory: docs
      run: |
        python3 -m venv "$RUNNER_TEMP/docs-venv"
        "$RUNNER_TEMP/docs-venv/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
    - name: Build documentation
      working-directory: docs
      run: make SPHINXBUILD="$RUNNER_TEMP/docs-venv/bin/sphinx-build" BUILDDIR="$RUNNER_TEMP/docs-build" html
  unit-test:
    name: Unit Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          pitaya-cli/go.sum
          tools/go.sum
          xk6-pitaya/go.sum
    - name: Setup dependencies
      run: make setup-ci
    - name: Run tests
      run: make test-coverage
    - name: Send coverage
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: GOWORK=off go tool -modfile=tools/go.mod goveralls -coverprofile=coverprofile.out -service=github
  e2e-test-nats:
    name: Nats Test End to End
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          pitaya-cli/go.sum
          tools/go.sum
          xk6-pitaya/go.sum
    - name: Run tests
      run: make e2e-test-nats
  e2e-test-grpc:
    name: GRPC Test End to End
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          pitaya-cli/go.sum
          tools/go.sum
          xk6-pitaya/go.sum
    - name: Run tests
      run: make e2e-test-grpc
