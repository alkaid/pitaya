name: Tests

on:
  push:
    branches:
    - main
    - 'codex/**'
  pull_request:
    branches:
    - main

jobs:
  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
    - name: Download dependencies
      run: go mod download
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: deps
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
    - name: Setup dependencies
      run: make setup-ci
    - name: Run tests
      run: make compile-root vet test-coverage
    - name: Send coverage
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: GOWORK=off go tool -modfile=tools/go.mod goveralls -coverprofile=coverprofile.out -service=github
  e2e-test-nats:
    name: Nats Test End to End
    runs-on: ubuntu-latest
    needs: deps
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
    - name: Run tests
      run: make e2e-test-nats
  e2e-test-grpc:
    name: GRPC Test End to End
    runs-on: ubuntu-latest
    needs: deps
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
    - name: Run tests
      run: make e2e-test-grpc
